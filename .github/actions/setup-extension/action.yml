name: Set up extension
description: Install Node.js and pnpm dependencies, then restore and verify the native CLI bundle.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: '24'

    - uses: pnpm/action-setup@v6
      with:
        package_json_file: extension/package.json
        cache: true
        cache_dependency_path: extension/pnpm-lock.yaml

    - uses: actions/download-artifact@v8
      with:
        name: native-cli

    - name: Restore and verify CLI binaries
      shell: bash
      run: |
        tar -xf cli-bundle.tar
        sha256sum --check SHA256SUMS

    - name: Install extension dependencies
      shell: bash
      working-directory: extension
      run: pnpm install --frozen-lockfile
