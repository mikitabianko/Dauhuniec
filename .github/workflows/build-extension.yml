name: Build extension

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review, closed]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.action == 'closed' && 'master' || github.ref }}
  cancel-in-progress: ${{ github.event.action != 'closed' }}

jobs:
  cli:
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    name: Test and build CLI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.merge_commit_sha || github.ref }}
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: go.sum

      - name: Test Go CLI
        run: go test ./...

      - name: Check Go code
        run: go vet ./...

      - name: Build CLI for Windows, macOS and Linux (x64 and ARM64)
        run: go run ./cmd/package

      # A tar archive preserves executable permissions between jobs.
      - name: Archive CLI binaries and checksums
        run: tar -cf cli-bundle.tar bin SHA256SUMS

      - name: Upload CLI bundle
        uses: actions/upload-artifact@v7
        with:
          name: native-cli
          path: cli-bundle.tar
          if-no-files-found: error
          retention-days: 30

  tests:
    name: Test extension
    needs: cli
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.merge_commit_sha || github.ref }}
          persist-credentials: false

      - uses: ./.github/actions/setup-extension

      - name: Test extension
        working-directory: extension
        run: pnpm test

  checks:
    name: PR checks
    if: always() && github.event.action != 'closed'
    needs: [cli, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require successful CLI and extension checks
        env:
          CLI_RESULT: ${{ needs.cli.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
        run: |
          echo "CLI: $CLI_RESULT"
          echo "Extension tests: $TESTS_RESULT"
          [[ "$CLI_RESULT" == success && "$TESTS_RESULT" == success ]]

  build:
    name: Package VSIX
    if: github.event.action == 'closed' && github.event.pull_request.merged == true
    needs: [cli, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-extension

      - name: Read package version
        id: version
        run: |
          version=$(node -p "require('./extension/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Package extension
        working-directory: extension
        run: pnpm run package

      - name: Verify bundled resources
        run: python3 scripts/ci/verify-vsix.py

      - name: Compute installer checksum
        working-directory: releases
        run: sha256sum *.vsix > SHA256SUMS

      - name: Upload downloadable installer
        uses: actions/upload-artifact@v7
        with:
          name: dauhuniec-${{ steps.version.outputs.version }}-vsix
          path: releases/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: dauhuniec-${{ needs.build.outputs.version }}-vsix
          path: releases

      - name: Publish installer and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v${{ needs.build.outputs.version }}
          RELEASE_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
        run: bash scripts/ci/publish-release.sh
