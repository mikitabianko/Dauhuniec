name: Build extension

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cli:
    name: Test CLI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-go
        with:
          scope: cli

      - name: Test Go CLI
        run: go test ./...

      - name: Check Go code
        run: go vet ./...

  tests:
    name: Test extension
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-extension

      - name: Test CI release scripts
        run: |
          node --test scripts/ci/plan-release.test.cjs
          python3 -m unittest discover -s scripts/ci -p 'test_*.py'

      - uses: ./.github/actions/setup-go
        with:
          scope: extension-tests

      # The integration test executes the CLI on this runner; release targets
      # are built separately by the release workflow.
      - name: Build runner-native CLI for extension tests
        run: go build -o bin/lon-linux-amd64 ./cmd/lon

      - name: Test extension
        working-directory: extension
        run: pnpm test

  checks:
    name: PR checks
    if: always()
    needs: [cli, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require successful CLI and extension checks
        env:
          CLI_RESULT: ${{ needs.cli.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
        run: |
          echo "CLI: $CLI_RESULT"
          echo "Extension tests: $TESTS_RESULT"
          [[ "$CLI_RESULT" == success && "$TESTS_RESULT" == success ]]
