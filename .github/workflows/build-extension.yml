name: Build extension

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cli:
    name: Test CLI (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-go
        with:
          scope: cli

      # Native Make is a test dependency here; end users use CubeIDE's copy.
      - name: Install native Make for Windows integration tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install make --yes --no-progress

      - name: Test Go CLI
        run: go test ./...

      - name: Check Go code
        run: go vet ./...

  tests:
    name: Test extension
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-extension

      - name: Test CI release scripts
        run: |
          node --test scripts/ci/plan-release.test.cjs
          python3 -m unittest discover -s scripts/ci -p 'test_*.py'

      - uses: ./.github/actions/setup-go
        with:
          scope: extension-tests

      # The integration test executes the CLI on this runner; release targets
      # are built separately by the release workflow.
      - name: Build runner-native CLI for extension tests
        run: go build -o bin/lon-linux-amd64 ./cmd/lon

      - name: Test extension
        working-directory: extension
        run: pnpm test

  windows-cubemx:
    name: Test CubeMX launch on Windows
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-extension

      - name: Test Windows executable launch and paths
        working-directory: extension
        run: |
          pnpm run compile
          node --test dist/test/cubeMX.test.js

  checks:
    name: PR checks
    if: always()
    needs: [cli, tests, windows-cubemx]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require successful CLI and extension checks
        env:
          CLI_RESULT: ${{ needs.cli.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          WINDOWS_RESULT: ${{ needs.windows-cubemx.result }}
        run: |
          echo "CLI: $CLI_RESULT"
          echo "Extension tests: $TESTS_RESULT"
          echo "Windows CubeMX tests: $WINDOWS_RESULT"
          [[ "$CLI_RESULT" == success && "$TESTS_RESULT" == success && "$WINDOWS_RESULT" == success ]]
