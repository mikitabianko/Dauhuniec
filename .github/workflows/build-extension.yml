name: Build extension

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cli:
    name: Test CLI (${{ matrix.os }})
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-go
        with:
          scope: cli

      # Native Make is a test dependency here; end users use CubeIDE's copy.
      - name: Install native Make for Windows integration tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install make --yes --no-progress

      - name: Test Go CLI
        run: go test ./...

      - name: Check Go code
        run: go vet ./...

  tests:
    name: Test extension (${{ matrix.os }})
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-extension

      - name: Test CI release scripts
        if: runner.os == 'Linux'
        run: |
          node --test scripts/ci/plan-release.test.cjs
          python3 -m unittest discover -s scripts/ci -p 'test_*.py'

      - uses: ./.github/actions/setup-go
        with:
          scope: extension-tests

      # The integration test executes the CLI on this runner; release targets
      # are built separately by the release workflow.
      - name: Build runner-native CLI for extension tests
        shell: bash
        run: go build -o "bin/lon-$(go env GOOS)-$(go env GOARCH)$(go env GOEXE)" ./cmd/lon

      - name: Test extension
        working-directory: extension
        run: pnpm test

  package:
    name: Verify PR installer
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/package-extension

  checks:
    name: PR checks
    if: always()
    needs: [cli, tests, package]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require successful CLI and extension checks
        env:
          CLI_RESULT: ${{ needs.cli.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          PACKAGE_REQUIRED: ${{ github.event_name == 'pull_request' }}
        run: |
          echo "CLI: $CLI_RESULT"
          echo "Extension tests: $TESTS_RESULT"
          echo "Packaging: $PACKAGE_RESULT"
          if [[ "$CLI_RESULT" != success || "$TESTS_RESULT" != success ]]; then
            exit 1
          fi
          if [[ "$PACKAGE_REQUIRED" == true ]]; then
            [[ "$PACKAGE_RESULT" == success ]]
          else
            [[ "$PACKAGE_RESULT" == skipped ]]
          fi
