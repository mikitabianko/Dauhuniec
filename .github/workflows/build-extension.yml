name: Build extension

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Test and package VSIX
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: extension/package.json
          cache: true
          cache_dependency_path: extension/pnpm-lock.yaml

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: go.sum

      - name: Read version and validate release tag
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./extension/package.json').version")
          if [[ "$REF_TYPE" == tag && "$REF_NAME" != "v$version" ]]; then
            echo "Release tag $REF_NAME must match package version v$version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Test Go CLI
        run: go test ./...

      - name: Check Go code
        run: go vet ./...

      - name: Build CLI for Windows, macOS and Linux (x64 and ARM64)
        run: go run ./cmd/package

      - name: Install extension dependencies
        working-directory: extension
        run: pnpm install --frozen-lockfile

      - name: Test extension
        working-directory: extension
        run: pnpm test

      - name: Package extension
        working-directory: extension
        run: pnpm run package

      - name: Verify bundled resources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          packages = list(Path('releases').glob('*.vsix'))
          assert len(packages) == 1, f'Expected one VSIX, got {packages}'
          with ZipFile(packages[0]) as package:
              for source in Path('bin').iterdir():
                  assert package.read(f'extension/bin/{source.name}') == source.read_bytes()
              for name in ['dist/extension.js', 'LICENSE.txt', 'GO-LICENSE.txt', 'THIRD-PARTY-NOTICES.txt']:
                  assert package.getinfo(f'extension/{name}').file_size > 0, name
          PY

      - name: Compute installer checksum
        working-directory: releases
        run: sha256sum *.vsix > SHA256SUMS

      - name: Upload downloadable installer
        uses: actions/upload-artifact@v7
        with:
          name: dauhuniec-${{ steps.version.outputs.version }}-vsix
          path: releases/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dauhuniec-${{ needs.build.outputs.version }}-vsix
          path: releases

      - name: Publish installer and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd releases
          sha256sum --check SHA256SUMS
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" ./*.vsix SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" ./*.vsix SHA256SUMS \
              --verify-tag --title "Dauhuniec $RELEASE_TAG" --generate-notes
          fi
