name: Inspect Marketplace identity

on:
  workflow_dispatch:

permissions: {}

jobs:
  identity:
    name: Get Marketplace profile ID
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: marketplace
    permissions:
      id-token: write
    steps:
      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Get Marketplace profile ID
        shell: bash
        run: |
          set -euo pipefail
          if ! profile_id=$(az rest \
            --method get \
            --url 'https://app.vssps.visualstudio.com/_apis/profile/profiles/me?api-version=7.1' \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 \
            --query id \
            --output tsv); then
            echo '::error::Could not read the Marketplace profile. Check whether the service principal must be added to an Azure DevOps organization connected to this Entra tenant.'
            exit 1
          fi
          if [[ -z "$profile_id" || "$profile_id" == "None" || "$profile_id" == "null" ]]; then
            echo '::error::Marketplace returned no profile ID.'
            exit 1
          fi
          echo "Marketplace profile ID: $profile_id"
          {
            echo '### Marketplace identity'
            echo
            printf 'Profile ID: `%s`\n' "$profile_id"
            echo
            echo 'Add this profile to your Marketplace publisher with the Contributor role.'
            echo 'Then set the repository Actions variable MARKETPLACE_PUBLISH_ENABLED to true.'
          } >> "$GITHUB_STEP_SUMMARY"
