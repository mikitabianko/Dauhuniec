name: Release extension

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-master
  cancel-in-progress: false
  queue: max

jobs:
  validation:
    name: Validate release commit
    uses: ./.github/workflows/build-extension.yml

  plan:
    name: Check release version
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Check version tag before building
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/plan-release.cjs

  build:
    name: Package VSIX
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/package-extension

      - name: Upload downloadable installer
        uses: actions/upload-artifact@v7
        with:
          name: dauhuniec-${{ needs.plan.outputs.version }}-vsix
          path: releases/
          overwrite: true
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    name: Publish GitHub Release
    needs: [validation, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: dauhuniec-${{ needs.build.outputs.version }}-vsix
          path: releases

      - name: Publish installer and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v${{ needs.build.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: bash scripts/ci/publish-release.sh

      # The publication script restores the original assets on a retry.
      - name: Upload published installer for Marketplace
        uses: actions/upload-artifact@v7
        with:
          name: dauhuniec-${{ needs.build.outputs.version }}-published
          path: releases/
          overwrite: true
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  marketplace:
    name: Publish to VS Code Marketplace
    needs: [build, release]
    if: vars.MARKETPLACE_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-extension

      - uses: actions/download-artifact@v8
        with:
          name: dauhuniec-${{ needs.build.outputs.version }}-published
          path: releases

      - name: Verify installer checksum
        working-directory: releases
        run: sha256sum --check SHA256SUMS

      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Publish verified VSIX
        working-directory: extension
        env:
          EXTENSION_VERSION: ${{ needs.build.outputs.version }}
        run: pnpm exec vsce publish --azure-credential --skip-duplicate --packagePath "../releases/dauhuniec-${EXTENSION_VERSION}.vsix"
