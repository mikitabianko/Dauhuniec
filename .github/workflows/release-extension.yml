name: Release extension

on:
  pull_request:
    branches: [master]
    types: [closed]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-master
  cancel-in-progress: false

jobs:
  validation:
    name: Validate merge commit
    if: github.event.pull_request.merged == true
    uses: ./.github/workflows/build-extension.yml

  build:
    name: Package VSIX
    needs: validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-extension

      - uses: actions/setup-go@v7
        id: go
        with:
          go-version: stable
          cache: false

      - name: Locate Go caches
        id: go-cache
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "image=$ImageOS" >> "$GITHUB_OUTPUT"

      # Keep cross-compilation outputs separate from the native test cache.
      # A new commit saves an updated cache; earlier builds seed incremental work.
      - name: Cache release Go modules and build outputs
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.go-cache.outputs.build }}
            ${{ steps.go-cache.outputs.modules }}
          key: release-go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache.outputs.image }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.event.pull_request.merge_commit_sha }}
          restore-keys: |
            release-go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache.outputs.image }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.mod', 'go.sum') }}-

      - name: Build CLI for Windows, macOS and Linux (x64 and ARM64)
        run: go run ./cmd/package -jobs 2

      - name: Read package version
        id: version
        run: |
          version=$(node -p "require('./extension/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Package extension
        working-directory: extension
        run: pnpm run package

      - name: Verify bundled resources
        run: python3 scripts/ci/verify-vsix.py

      - name: Compute installer checksum
        working-directory: releases
        run: sha256sum *.vsix > SHA256SUMS

      - name: Upload downloadable installer
        uses: actions/upload-artifact@v7
        with:
          name: dauhuniec-${{ steps.version.outputs.version }}-vsix
          path: releases/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: dauhuniec-${{ needs.build.outputs.version }}-vsix
          path: releases

      - name: Publish installer and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v${{ needs.build.outputs.version }}
          RELEASE_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
        run: bash scripts/ci/publish-release.sh

  marketplace:
    name: Publish to VS Code Marketplace
    needs: [build, release]
    if: vars.MARKETPLACE_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-extension

      - uses: actions/download-artifact@v8
        with:
          name: dauhuniec-${{ needs.build.outputs.version }}-vsix
          path: releases

      - name: Verify installer checksum
        working-directory: releases
        run: sha256sum --check SHA256SUMS

      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Publish verified VSIX
        working-directory: extension
        env:
          EXTENSION_VERSION: ${{ needs.build.outputs.version }}
        run: pnpm exec vsce publish --azure-credential --packagePath "../releases/dauhuniec-${EXTENSION_VERSION}.vsix"
