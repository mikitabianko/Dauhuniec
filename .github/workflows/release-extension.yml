name: Release extension

on:
  pull_request:
    branches: [master]
    types: [closed]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-master
  cancel-in-progress: false

jobs:
  validation:
    name: Validate merge commit
    if: github.event.pull_request.merged == true
    uses: ./.github/workflows/build-extension.yml

  build:
    name: Package VSIX
    needs: validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-extension

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: go.sum

      - name: Build CLI for Windows, macOS and Linux (x64 and ARM64)
        run: go run ./cmd/package

      # A tar archive preserves executable permissions in the download.
      - name: Archive CLI binaries and checksums
        run: tar -cf cli-bundle.tar bin SHA256SUMS

      - name: Upload CLI bundle
        uses: actions/upload-artifact@v7
        with:
          name: native-cli
          path: cli-bundle.tar
          if-no-files-found: error
          retention-days: 30

      - name: Read package version
        id: version
        run: |
          version=$(node -p "require('./extension/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Package extension
        working-directory: extension
        run: pnpm run package

      - name: Verify bundled resources
        run: python3 scripts/ci/verify-vsix.py

      - name: Compute installer checksum
        working-directory: releases
        run: sha256sum *.vsix > SHA256SUMS

      - name: Upload downloadable installer
        uses: actions/upload-artifact@v7
        with:
          name: dauhuniec-${{ steps.version.outputs.version }}-vsix
          path: releases/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: dauhuniec-${{ needs.build.outputs.version }}-vsix
          path: releases

      - name: Publish installer and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v${{ needs.build.outputs.version }}
          RELEASE_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
        run: bash scripts/ci/publish-release.sh
